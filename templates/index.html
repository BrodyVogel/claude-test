<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coverage Monitor — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800">Coverage Monitor</h1>
        <div class="flex gap-4">
            <a href="/" class="text-blue-600 font-medium">Dashboard</a>
            <a href="/onboard" class="text-gray-600 hover:text-blue-600">+ Onboard Company</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">Morning Dashboard</h2>
            <div class="flex items-center gap-3">
                <span id="last-updated" class="text-sm text-gray-500"></span>
                <label class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 cursor-pointer text-sm font-medium">
                    Import Sweep
                    <input type="file" accept=".json" id="sweep-file" class="hidden" onchange="uploadSweep(this)">
                </label>
            </div>
        </div>
        <div id="sweep-result" class="mb-6 hidden"></div>

        <!-- Alerts summary -->
        <div id="alerts-bar" class="mb-6 hidden">
            <div class="flex gap-4">
                <div id="red-alerts" class="bg-red-50 border border-red-200 rounded-lg px-4 py-2 hidden">
                    <span class="text-red-700 font-semibold"></span>
                </div>
                <div id="amber-alerts" class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 hidden">
                    <span class="text-amber-700 font-semibold"></span>
                </div>
            </div>
        </div>

        <!-- Companies table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Company</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ticker</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Rating</th>
                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Price</th>
                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Target</th>
                        <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Upside</th>
                        <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Suggested</th>
                        <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Alerts</th>
                        <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody id="companies-body" class="divide-y divide-gray-100">
                    <tr><td colspan="9" class="px-4 py-8 text-center text-gray-400">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="empty-state" class="hidden text-center py-16">
            <p class="text-gray-500 mb-4">No companies onboarded yet.</p>
            <a href="/onboard" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Onboard Your First Company</a>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
        loadDashboard();

        async function uploadSweep(input) {
            const file = input.files[0];
            if (!file) return;
            const resultDiv = document.getElementById('sweep-result');
            resultDiv.className = 'mb-6 bg-blue-50 border border-blue-200 rounded-lg px-4 py-3 text-sm text-blue-800';
            resultDiv.textContent = 'Importing sweep data...';

            try {
                const formData = new FormData();
                formData.append('file', file);
                const resp = await fetch('/api/import/sweep', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.error) {
                    resultDiv.className = 'mb-6 bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm text-red-800';
                    resultDiv.textContent = data.error;
                } else {
                    const s = data.summary;
                    let msg = `Sweep imported: ${s.companies_processed} companies, ${s.indicators_updated} indicators updated, ${s.status_changes} status changes.`;
                    if (s.unmatched_indicators && s.unmatched_indicators.length > 0) {
                        msg += ` Unmatched: ${s.unmatched_indicators.map(u => u.ticker + '/' + u.indicator_name).join(', ')}.`;
                    }
                    if (s.errors && s.errors.length > 0) {
                        msg += ` Errors: ${s.errors.join('; ')}`;
                    }
                    resultDiv.className = 'mb-6 bg-green-50 border border-green-200 rounded-lg px-4 py-3 text-sm text-green-800';
                    resultDiv.textContent = msg;
                    loadDashboard();
                }
            } catch (err) {
                resultDiv.className = 'mb-6 bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm text-red-800';
                resultDiv.textContent = 'Upload failed: ' + err.message;
            }
            input.value = '';
        }
    </script>
</body>
</html>
